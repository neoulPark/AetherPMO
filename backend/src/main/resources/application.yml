spring:
  application:
    name: aetherpmo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetherpmo}
    username: ${SPRING_DATASOURCE_USERNAME:aetherpmo}
    password: ${SPRING_DATASOURCE_PASSWORD:aetherpmo1234!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:*}

logging:
  level:
    com.aetherpmo: INFO
