# Render Blueprint — 백엔드(Spring Boot) + PostgreSQL 자동 생성
# https://render.com/docs/blueprint-spec
databases:
  - name: aetherpmo-db
    databaseName: aetherpmo
    user: aetherpmo
    plan: free

services:
  - type: web
    name: aetherpmo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # DB 연결 — 블루프린트가 위 DB의 연결 문자열을 자동 주입.
      # DatabaseUrlPostProcessor가 postgres:// → jdbc:postgresql:// 로 변환.
      - key: DATABASE_URL
        fromDatabase:
          name: aetherpmo-db
          property: connectionString
      # 프론트(Vercel) 오리진 — 배포 후 실제 URL로 설정 (대시보드에서 입력)
      - key: APP_CORS_ORIGINS
        sync: false
